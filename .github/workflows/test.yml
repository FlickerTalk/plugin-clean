# Los tests del plugin en cada cambio; el build (`dist/` tiene que salir de `src/`), y las licencias
# de lo que va dentro del paquete (solo permisivas: nada copyleft).
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code dist/
      - run: npx --yes license-checker@25.0.1 --production --excludePrivatePackages --onlyAllow "MIT;(MIT AND Zlib);0BSD"
